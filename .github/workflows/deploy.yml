name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typen prüfen & Seite bauen
        run: npm run build

      - name: Build-Ergebnis hochladen
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  deploy:
    name: Deploy zu Strato
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Build-Ergebnis herunterladen
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Erwartet folgende Repository-Secrets (Settings → Secrets and variables → Actions):
      #   STRATO_FTP_SERVER    z. B. ftp.twentysixersbadberka.de
      #   STRATO_FTP_USERNAME  FTP-Zugangsdaten aus dem Strato-Kundenmenü
      #   STRATO_FTP_PASSWORD
      #   STRATO_FTP_SERVER_DIR  Zielordner im Webspace, i. d. R. "/" oder "/htdocs/"
      - name: Per FTPS zu Strato hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.STRATO_FTP_SERVER }}
          username: ${{ secrets.STRATO_FTP_USERNAME }}
          password: ${{ secrets.STRATO_FTP_PASSWORD }}
          server-dir: ${{ secrets.STRATO_FTP_SERVER_DIR }}
          local-dir: dist/
          protocol: ftps
